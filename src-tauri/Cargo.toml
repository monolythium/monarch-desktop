[package]
name = "monarch-desktop"
version = "0.0.28"
edition = "2021"
rust-version = "1.77"
description = "Monarch Desktop — operator and cluster GUI for Monolythium v5.0 (Tauri 2)"
license = "Apache-2.0"
publish = false

[lib]
name = "monarch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "monarch-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Self-update: pulls the signed latest.json manifest from the project's
# GitHub Releases, verifies the platform asset signature against the
# `plugins.updater.pubkey` in tauri.conf.json, and downloads + applies
# the update on user confirmation. The matching frontend module is
# `src/sdk/updater.ts`. tauri-plugin-process is paired so the frontend
# can `relaunch()` after `downloadAndInstall()`.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
async-trait = "0.1"
thiserror = "1"
base64 = "0.22"
talos-rust-client = { version = "0.1.3", features = ["talosconfig"] }
# Maintenance-mode Talos channel (src/talos_maintenance.rs). A freshly
# flashed Monarch OS node answers the Talos API on :50000 with a
# self-signed cert and NO client-cert requirement (insecure / maintenance
# mode), which the mTLS `TalosConnector` cannot speak. tonic 0.12 exposes
# no hook to inject a custom rustls verifier through `ClientTlsConfig`, so
# the maintenance channel is built by hand: a `tokio-rustls` TLS connector
# carrying a `rustls` 0.23 ClientConfig with an accept-any-server-cert
# verifier and no client identity, fed to tonic's
# `Endpoint::connect_with_connector`. `hyper-util` supplies the `TokioIo`
# adapter tonic's connector contract expects; `tower` provides the
# `Service<Uri>` the connector implements. Versions are pinned to the
# already-resolved lockfile entries (rustls 0.23.39, tokio-rustls 0.26,
# hyper-util 0.1, tower 0.4) — all transitive deps of the existing tonic
# stack, promoted to direct so the maintenance module can name them. The
# insecure verifier is strictly confined to that module and never reaches
# the trusted mTLS connector in talos.rs.
rustls = "0.23"
tokio-rustls = "0.26"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.4"
# SSH bridge over russh. Pinned to 0.46 (latest 0.4x with the
# stable client::Handler API used in `src/ssh.rs`); russh-keys is the
# matching key-loading sibling.
russh = "0.46"
russh-keys = "0.46"
# OS keychain via the `keyring` crate. Tauri 2 compatible. The
# `apple-native` feature routes through the macOS Security framework
# (no DBus / secret-service dependency on the dev box). Linux/Windows
# add their own native features when those builds light up.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# advisory bridge. `reqwest` is the HTTPS client both the Hosted provider
# and Local providers use; `rustls-tls` keeps us off the system OpenSSL
# (smaller bundle, no platform variance). `stream` enables the byte
# stream we tail for SSE / line-delimited JSON. `futures-util` gives us
# `StreamExt::next` over that stream. `dirs` resolves the per-user
# config directory (`~/.config/monarch-desktop/ai.toml` on Unix, the
# matching Roaming dir on Windows). `toml` parses + emits that file.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
flate2 = "1"
tokio-util = { version = "0.7", features = ["io"] }
dirs = "5"
toml = "0.8"
tar = "0.4"
tauri-plugin-dialog = "2"
x509-parser = "0.17"
# SEC1 `EC PRIVATE KEY` encoding for the Kubernetes-side CAs. p256's own
# `to_sec1_pem()` OMITS the optional named-curve parameters field, which makes
# Go's `x509.ParseECPrivateKey` (and therefore Talos) reject the key with
# "unknown elliptic curve". We construct the `EcPrivateKey` by hand with the
# prime256v1 OID present, matching what talosctl emits. Pinned to the same 0.7
# line p256 0.13 already resolves.
sec1 = { version = "0.7", default-features = false, features = ["der", "pem", "alloc"] }
sha2 = "0.10"
# Talos machine-identity generation (src/talos_maintenance.rs). A fresh
# Monarch OS node needs its own Talos machine CA + bootstrap token before
# Talos will accept a machine config (the `talosctl gen secrets` equivalent).
# `rcgen` mints the self-signed Ed25519 issuing CA (O=talos), matching the
# cert shape `talosctl gen secrets` produces; pinned to the resolved
# lockfile entry (0.13). Promoted from transitive to direct so the
# maintenance module can name it.
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
# Full-node provisioning PKI (src/provision.rs). The validated machine config
# carries the complete Talos cluster PKI, so the generator mints every key
# shape talosctl emits: `p256` re-encodes the rcgen/ring P-256 CA keys to the
# SEC1 `EC PRIVATE KEY` PEM Talos's Go parser switches on, `rsa` mints the
# RSA-4096 PKCS#1 service-account key, `time` pins the talosctl-shaped 10-year
# CA validity windows on rcgen params, and `rand_core06` is the rand_core 0.6
# OsRng the `rsa` 0.9 keygen API expects (the workspace `rand` is 0.9, whose
# rand_core is incompatible). All pinned to already-resolved lockfile entries
# (transitive deps promoted to direct).
p256 = "0.13"
rsa = "0.9"
time = "0.3"
rand_core06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
# Operator chat (Phase 1 MVP). Self-contained, no mono-core coupling.
# `libp2p` runs a minimal gossipsub node for cluster channels — only the
# transport + gossipsub features the chat backend needs (tcp / noise /
# yamux / tokio / gossipsub / macros for the derive). `fips204` provides
# the ML-DSA-65 signing that reuses the operator's PQM-1 key; `bip39`
# decodes the mnemonic to the PQM-1 payload; `sha3` (SHAKE256 + keccak)
# and `blake3` reproduce the SDK's seed + address derivation byte-for-
# byte. `rusqlite` (bundled SQLite amalgamation — no system lib) backs
# the local message store. `rand` fills per-message nonces; `zeroize`
# clears the mnemonic + seed after key derivation.
libp2p = { version = "0.56", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "macros"] }
fips204 = "0.4.6"
bip39 = "2"
bech32 = "0.11"
sha3 = "0.10"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.9"
zeroize = "1"

[features]
# Default to no custom features. Production builds opt in via `--features custom-protocol`.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# RSA-4096 keygen via the pure-Rust `rsa` crate is unusably slow at opt-level 0
# (minutes per key in dev/test builds). Optimize just the bignum-heavy crates
# in dev so the provisioning generator stays at seconds; release builds are
# already fully optimized.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3
